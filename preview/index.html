<style>

/* Hallmark · v2.0.0 · redesign: reskin · theme: ink (deal: manual) · ink: paper · genre: editorial · shape: Index-First handbook, title beside a ruled work list · signature: the work list as a lending-desk shelf, every job one ruled row · fonts: Epilogue for heads and figures, Pretendard for Hangul · copy: verbatim */
/* critique: a handbook a new hire keeps open all day, so it is plain black on white like a well-run notice desk; teal marks only the way in (links on hover, focus, the step you are on) */
/* waive 22 · ink and greys at zero chroma · a notice board is printed in plain black */
:root {
  --color-paper: oklch(99.5% 0.003 100); --color-paper-2: oklch(97% 0.004 100); --color-paper-3: oklch(94% 0.006 100);
  --color-ink: oklch(16% 0 0); --color-ink-2: oklch(28% 0 0); --color-muted: oklch(44% 0 0);
  --color-rule: oklch(89% 0.004 100); --color-rule-2: oklch(93.5% 0.003 100);
  --color-accent: oklch(50% 0.095 188); --color-accent-ink: oklch(99.5% 0.003 100); --color-accent-soft: oklch(93% 0.05 190); --color-accent-soft-ink: oklch(27% 0.045 190);
  --color-focus: oklch(50% 0.095 188);
  --font-display: "Epilogue", "Pretendard", ui-sans-serif, system-ui, sans-serif; --font-body: "Epilogue", "Pretendard", ui-sans-serif, system-ui, sans-serif;
  --font-outlier: "IBM Plex Mono", "Pretendard", ui-monospace, monospace;
  --radius-card: 12px; --radius-ctl: 10px; --radius-pill: 999px; --rule-hair: 1px;
  --tracking-display: -0.04em; --display-weight: 700;
  --text-xs: 0.8125rem; --text-sm: 0.9375rem; --text-base: 1.0625rem; --text-lg: 1.25rem; --text-xl: 1.625rem; --text-2xl: 2.25rem; --text-display: clamp(2.5rem, 5vw, 4.25rem);
  --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px; --space-3xl: 96px;
  --measure: 42em; --container: 1180px; --dur-micro: 120ms;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; }
html { scroll-padding-top: var(--space-lg); -webkit-text-size-adjust: 100%; scrollbar-color: var(--color-rule) var(--color-paper); }
body { margin: 0; background: var(--color-paper); color: var(--color-ink-2); font-family: var(--font-body); font-size: var(--text-base); line-height: 1.7; word-break: keep-all; overflow-wrap: break-word; -webkit-font-smoothing: antialiased; }
p, li, td, dd { text-wrap: pretty; }
h1, h2, h3, h4 { font-family: var(--font-display); font-weight: var(--display-weight); color: var(--color-ink); letter-spacing: var(--tracking-display); text-wrap: balance; overflow-wrap: break-word; min-width: 0; }
img { max-width: 100%; }
a:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; transition: none; }
b, strong { color: var(--color-ink); font-weight: 600; }
.wrap { width: 100%; max-width: var(--container); margin-inline: auto; padding-inline: var(--space-lg); }
.cols { display: grid; grid-template-columns: 220px minmax(0, 1fr); gap: var(--space-xl); padding-block: var(--space-xl) var(--space-3xl); align-items: start; }
@media (max-width: 900px) { .cols { grid-template-columns: minmax(0, 1fr); } nav.rail { display: none; } }

nav.rail ol { list-style: none; margin: 0; padding: 0; }
main { min-width: 0; }
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; margin: var(--space-sm) 0 var(--space-md); font-size: var(--text-sm); line-height: 1.6; }

td:first-child { white-space: nowrap; }
@media (max-width: 620px) { td:first-child { white-space: normal; } }
ol.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; max-width: var(--measure); }

.prep ul { list-style: none; margin: 0; padding: 0; display: grid; gap: var(--space-xs); }

.note p { margin: 0; }
figure { margin: var(--space-sm) 0 var(--space-xs); max-width: 100%; }
figure img { display: block; width: auto; max-width: 100%; height: auto; max-height: 640px; object-fit: contain; }
figcaption { margin-top: var(--space-2xs); font-size: var(--text-xs); color: var(--color-muted); }

@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; } }
@media print { nav.rail { display: none; } .cols { grid-template-columns: minmax(0, 1fr); } }

a { color: var(--color-ink); font-weight: 600; text-decoration-line: underline; text-decoration-color: var(--color-rule); text-decoration-thickness: 2px; text-underline-offset: 0.2em; transition: text-decoration-color var(--dur-micro); }
a:hover { text-decoration-color: var(--color-accent); }
::selection { background: var(--color-accent-soft); color: var(--color-accent-soft-ink); }
code { font-family: var(--font-outlier); font-size: 0.88em; background: var(--color-paper-3); padding: 1px 6px; border-radius: 6px; }

header.top { border-bottom: var(--rule-hair) solid var(--color-ink); }
header.top .wrap { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); grid-template-rows: auto auto auto 1fr; gap: var(--space-lg) var(--space-2xl); padding-block: var(--space-3xl) var(--space-2xl); align-items: start; }
header.top h1 { grid-column: 1; margin: 0; font-size: var(--text-display); line-height: 1.02; }

ol.index li { border-bottom: var(--rule-hair) solid var(--color-rule); }
ol.index a { display: grid; grid-template-columns: 2.5rem minmax(0, 13em) minmax(0, 1fr); gap: var(--space-md); align-items: baseline; padding: var(--space-md) var(--space-2xs); text-decoration: none; font-weight: 400; color: var(--color-ink-2); border-radius: var(--radius-ctl); transition: background-color var(--dur-micro); }
ol.index a:hover { background: var(--color-paper-2); }
ol.index .no { font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); color: var(--color-ink); }
ol.index .t { font-weight: 700; font-size: var(--text-lg); color: var(--color-ink); letter-spacing: -0.02em; line-height: 1.3; }
ol.index .d { font-size: var(--text-sm); color: var(--color-muted); line-height: 1.5; }
@media (max-width: 900px) { header.top .wrap { grid-template-columns: minmax(0, 1fr); } header.top .lede { margin-top: 0; } ol.index { grid-column: 1; grid-row: auto; } ol.index a { grid-template-columns: 2rem minmax(0, 1fr); } ol.index .d { grid-column: 2; } }

nav.rail a { display: block; padding: 6px var(--space-sm); color: var(--color-ink-2); text-decoration: none; font-weight: 400; line-height: 1.4; border-radius: var(--radius-ctl); }
nav.rail a:hover { background: var(--color-paper-3); color: var(--color-ink); }
nav.rail a.grp { font-weight: 700; color: var(--color-ink); margin-top: var(--space-md); }
nav.rail a.grp:first-child { margin-top: 0; }
nav.rail .n { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); margin-right: var(--space-xs); }

.part { margin: var(--space-3xl) 0 0; padding: var(--space-xl) 0 var(--space-lg); border-top: var(--rule-hair) solid var(--color-ink); scroll-margin-top: var(--space-lg); }
main > .part:first-child { margin-top: 0; padding-top: var(--space-md); }
.part h2 { margin: 0 0 var(--space-sm); font-size: var(--text-2xl); line-height: 1.05; }
.part p { margin: 0; max-width: var(--measure); font-size: var(--text-lg); line-height: 1.55; }
section { padding: var(--space-xl) 0; border-top: var(--rule-hair) solid var(--color-rule); scroll-margin-top: var(--space-lg); }
section > h2 { margin: 0 0 var(--space-xs); font-size: var(--text-xl); line-height: 1.15; display: flex; gap: var(--space-sm); align-items: baseline; }
section > h2 .n { flex: none; font-size: var(--text-sm); font-weight: 600; letter-spacing: 0; color: var(--color-accent-soft-ink); background: var(--color-accent-soft); padding: 2px 10px; border-radius: var(--radius-pill); transform: translateY(-3px); }
section > p.lead { margin: 0 0 var(--space-lg); max-width: var(--measure); color: var(--color-muted); }
h3 { margin: var(--space-xl) 0 var(--space-sm); font-size: var(--text-lg); line-height: 1.25; letter-spacing: -0.025em; }
section h4 { margin: var(--space-lg) 0 var(--space-xs); font-size: var(--text-base); }

.prep { margin: 0 0 var(--space-lg); padding: var(--space-md) var(--space-lg); background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); }
.prep .h { font-size: var(--text-sm); font-weight: 600; color: var(--color-muted); margin-bottom: var(--space-xs); }
.prep li span { color: var(--color-muted); font-size: var(--text-sm); padding-top: 2px; }

ol.steps { border-top: var(--rule-hair) solid var(--color-ink); }
ol.steps > li { display: grid; grid-template-columns: 2.75rem minmax(0, 1fr); gap: var(--space-sm); padding-block: var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
ol.steps > li::before { content: counter(s); font-family: var(--font-display); font-weight: 700; font-size: var(--text-xl); letter-spacing: -0.04em; line-height: 1.1; color: var(--color-ink); }

table { border-top: var(--rule-hair) solid var(--color-ink); }
th { font-weight: 400; font-size: var(--text-sm); color: var(--color-muted); padding: var(--space-sm) var(--space-sm) var(--space-xs); border-bottom: var(--rule-hair) solid var(--color-rule); }
td { padding: var(--space-sm); border-bottom: var(--rule-hair) solid var(--color-rule); }
td:first-child { color: var(--color-ink); font-weight: 600; }

.note { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: var(--space-md); align-items: baseline; margin: var(--space-md) 0; padding: var(--space-md) var(--space-lg); background: var(--color-paper-2); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); max-width: var(--measure); font-size: var(--text-sm); }
.note .tag { font-size: var(--text-xs); font-weight: 600; padding: 2px 10px; border-radius: var(--radius-pill); color: var(--color-muted); box-shadow: inset 0 0 0 var(--rule-hair) var(--color-rule); background: var(--color-paper); white-space: nowrap; }
.note.warn .tag { background: var(--color-ink); color: var(--color-paper); box-shadow: none; }

ul.check { list-style: none; margin: var(--space-sm) 0 0; padding: 0; max-width: var(--measure); border-top: var(--rule-hair) solid var(--color-ink); }
ul.check li { position: relative; padding: var(--space-sm) 0 var(--space-sm) 2.25rem; border-bottom: var(--rule-hair) solid var(--color-rule); }
ul.check li::before { content: ""; position: absolute; left: 2px; top: calc(var(--space-sm) + 0.3em); width: 16px; height: 16px; border: 1.5px solid var(--color-ink); border-radius: 5px; }

figure img { border-radius: var(--radius-card); outline: var(--rule-hair) solid var(--color-rule); outline-offset: -1px; background: var(--color-paper-3); }
section h3 { padding-top: var(--space-md); border-top: var(--rule-hair) solid var(--color-rule); }
footer { border-top: var(--rule-hair) solid var(--color-ink); }

a.how { font-size: var(--text-sm); font-weight: 400; color: var(--color-muted); white-space: nowrap; margin-left: 2px; }
a.how:hover { color: var(--color-ink); }
.prep li { grid-template-columns: minmax(0, 15em) minmax(0, 1fr); }
@media (max-width: 620px) { .prep li { grid-template-columns: minmax(0, 1fr); } }
nav.rail a[aria-current="true"] { background: var(--color-accent-soft); color: var(--color-accent-soft-ink); font-weight: 600; }
nav.rail a[aria-current="true"] .n { color: var(--color-accent-soft-ink); }
@media (max-width: 620px) { header.top .wrap { padding-block: var(--space-2xl) var(--space-xl); } section > h2 { flex-wrap: wrap; } .note { grid-template-columns: minmax(0, 1fr); gap: var(--space-xs); } .note .tag { justify-self: start; } }


/* app layer: shared editing, owner view, month calendar. Same ink tokens as the handbook. */
:root { --p-ke: oklch(50% 0.095 188); --p-ke-soft: oklch(94% 0.04 190); --p-yj: oklch(55% 0.12 62); --p-yj-soft: oklch(95% 0.045 75); --p-ye: oklch(50% 0.12 345); --p-ye-soft: oklch(95% 0.03 345); --p-all: oklch(28% 0 0); --p-all-soft: oklch(94% 0.004 100); --p-none: oklch(60% 0 0); --p-none-soft: oklch(97% 0.003 100); --bar-h: 56px; }
html { scroll-padding-top: calc(var(--bar-h) + 16px); }
section, .part { scroll-margin-top: calc(var(--bar-h) + 16px); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
[hidden] { display: none !important; }

.btn { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 14px; border-radius: var(--radius-ctl); border: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); white-space: nowrap; transition: background-color var(--dur-micro), border-color var(--dur-micro); }
.btn:hover { background: var(--color-paper-2); border-color: var(--color-muted); }
.btn.primary { background: var(--color-ink); color: var(--color-paper); border-color: var(--color-ink); }
.btn.primary:hover { background: var(--color-ink-2); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--color-muted); }
.btn.ghost:hover { color: var(--color-ink); background: var(--color-paper-3); }
.btn.danger { color: oklch(48% 0.16 27); }
.btn.danger:hover { border-color: oklch(48% 0.16 27); background: oklch(97% 0.02 27); }
.btn.sm { min-height: 30px; padding: 0 10px; font-size: var(--text-xs); }
.btn[disabled] { opacity: .5; cursor: default; }
.field { width: 100%; min-height: 40px; padding: 8px 12px; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); font-size: var(--text-sm); line-height: 1.5; }
.field:hover { border-color: var(--color-muted); }
textarea.field { min-height: 92px; resize: vertical; }
label.lab { display: grid; gap: 6px; font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); }
label.lab small, .lab small { font-weight: 400; color: var(--color-muted); }
.hint { font-size: var(--text-xs); color: var(--color-muted); margin: 0; }
.hint.ok { color: var(--color-accent-soft-ink); }
.hint.bad { color: oklch(48% 0.16 27); }

/* top bar */
.bar { position: sticky; top: 0; z-index: 30; background: color-mix(in oklch, var(--color-paper) 94%, transparent); backdrop-filter: blur(8px); border-bottom: var(--rule-hair) solid var(--color-rule); }
.bar .wrap { display: flex; align-items: center; gap: var(--space-sm); min-height: var(--bar-h); }
.tabs { display: flex; gap: 2px; padding: 3px; border-radius: var(--radius-pill); background: var(--color-paper-3); }
.tabs button { border: 0; background: transparent; padding: 6px 16px; border-radius: var(--radius-pill); font-size: var(--text-sm); font-weight: 600; color: var(--color-muted); }
.tabs button[aria-selected="true"] { background: var(--color-paper); color: var(--color-ink); box-shadow: 0 1px 2px oklch(0% 0 0 / .08); }
.bar .grow { flex: 1; }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); cursor: pointer; user-select: none; }
.switch input { appearance: none; width: 38px; height: 22px; border-radius: 99px; background: var(--color-rule); position: relative; margin: 0; cursor: pointer; transition: background-color var(--dur-micro); }
.switch input::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--color-paper); box-shadow: 0 1px 2px oklch(0% 0 0 / .2); transition: transform var(--dur-micro); }
.switch input:checked { background: var(--color-accent); }
.switch input:checked::after { transform: translateX(16px); }
.me { font-size: var(--text-xs); color: var(--color-muted); background: transparent; border: 0; padding: 4px 6px; border-radius: 8px; }
.me:hover { background: var(--color-paper-3); color: var(--color-ink); }
.sync { font-size: var(--text-xs); color: var(--color-muted); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--color-rule); }
.sync.live::before { background: var(--color-accent); }
.sync.bad::before { background: oklch(55% 0.18 27); }
@media (max-width: 760px) { :root { --bar-h: 104px; } .bar .wrap { flex-wrap: wrap; padding-block: 8px; gap: 8px; } .bar .grow { display: none; } .sync { order: 9; } }

/* header index (dynamic) */
header.top .actions { grid-column: 1; display: flex; gap: var(--space-xs); flex-wrap: wrap; }

/* owner line + filters */
.who-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 var(--space-md); padding: 0 0 var(--space-md); border-bottom: var(--rule-hair) solid var(--color-rule); }
.who-filter .lab2 { width: 100%; font-size: var(--text-xs); color: var(--color-muted); font-weight: 600; }
.chipbtn { border: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); border-radius: var(--radius-pill); padding: 3px 10px; font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-2); }
.chipbtn[aria-pressed="true"] { background: var(--color-ink); border-color: var(--color-ink); color: var(--color-paper); }
.owner { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; margin: 0 0 var(--space-md); font-size: var(--text-xs); color: var(--color-muted); }
.pchip { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px 2px 3px; border-radius: var(--radius-pill); font-weight: 600; font-size: var(--text-xs); line-height: 1.5; background: var(--pc-soft); color: var(--color-ink); }
.pchip i { font-style: normal; display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; background: var(--pc); color: var(--color-paper); font-size: 10px; }
.pchip.none { background: var(--p-none-soft); color: var(--color-muted); padding-left: 9px; box-shadow: inset 0 0 0 1px var(--color-rule); }
.rtag { border: 0; font-size: var(--text-xs); cursor: pointer; display: inline-flex; gap: 4px; align-items: center; padding: 2px 9px; border-radius: var(--radius-pill); box-shadow: inset 0 0 0 1px var(--color-rule); color: var(--color-ink-2); background: var(--color-paper); font-weight: 600; }
.rtag b { font-weight: 400; color: var(--color-muted); }
.edited { font-size: var(--text-xs); color: var(--color-muted); margin: var(--space-md) 0 0; }
.p-ke { --pc: var(--p-ke); --pc-soft: var(--p-ke-soft); }
.p-yj { --pc: var(--p-yj); --pc-soft: var(--p-yj-soft); }
.p-ye { --pc: var(--p-ye); --pc-soft: var(--p-ye-soft); }
.p-all { --pc: var(--p-all); --pc-soft: var(--p-all-soft); }
.p-etc { --pc: oklch(45% 0.06 250); --pc-soft: oklch(95% 0.015 250); }

section > h2 .tt { flex: 1; min-width: 0; }
section > h2 .edit-btn, .part .edit-btn { flex: none; margin-left: auto; letter-spacing: 0; font-family: var(--font-body); transform: translateY(-2px); }
.part .phead { display: flex; align-items: baseline; gap: var(--space-sm); }
.part .phead h2 { flex: 1; }
section.flash { animation: flash 1.6s ease-out; }
@keyframes flash { 0% { background: var(--color-accent-soft); } 100% { background: transparent; } }
.empty-note { padding: var(--space-xl) 0; color: var(--color-muted); }

/* inline editor */
section.editing { padding-inline: var(--space-lg); margin-inline: calc(var(--space-lg) * -1); background: var(--color-paper-2); border-radius: var(--radius-card); border-top-color: transparent; outline: 2px solid var(--color-ink); outline-offset: -2px; }
.ed { display: grid; gap: var(--space-md); }
.ed-title { display: flex; align-items: center; gap: var(--space-sm); font-size: var(--text-sm); font-weight: 700; color: var(--color-ink); }
.ed-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: var(--space-md); }
.ed-grid3 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr); gap: var(--space-md); }
@media (max-width: 760px) { .ed-grid, .ed-grid3 { grid-template-columns: minmax(0, 1fr); } }
.withs { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; min-height: 40px; font-size: var(--text-sm); font-weight: 400; }
.withs label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.box { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); padding: var(--space-md); display: grid; gap: var(--space-sm); }
.box .bh { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: baseline; font-size: var(--text-sm); font-weight: 700; color: var(--color-ink); }
.box .bh small { font-weight: 400; color: var(--color-muted); }
.rtlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rtlist li { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 8px 6px 12px; border-radius: var(--radius-ctl); background: var(--color-paper-2); font-size: var(--text-sm); }
.rtlist li .rt-t { flex: 1; min-width: 12em; font-weight: 600; color: var(--color-ink); }
.rtlist li .rt-w { font-size: var(--text-xs); color: var(--color-muted); }
.rtnew { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.4fr) minmax(0, .8fr) auto; gap: var(--space-xs); align-items: start; }
@media (max-width: 760px) { .rtnew { grid-template-columns: minmax(0, 1fr); } }
.toolbar { position: sticky; top: calc(var(--bar-h) + 6px); z-index: 5; display: flex; flex-wrap: wrap; gap: 4px; padding: 6px; border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-ctl); background: var(--color-paper); box-shadow: 0 2px 8px oklch(0% 0 0 / .05); }
.toolbar .sep { width: 1px; background: var(--color-rule); margin: 4px 2px; }
.toolbar button { border: 0; background: transparent; border-radius: 8px; padding: 5px 10px; font-size: var(--text-xs); font-weight: 600; color: var(--color-ink-2); }
.toolbar button:hover { background: var(--color-paper-3); color: var(--color-ink); }
.rich { min-height: 220px; padding: var(--space-md) var(--space-lg); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); background: var(--color-paper); outline: none; }
.rich:focus { border-color: var(--color-ink); box-shadow: 0 0 0 3px var(--color-accent-soft); }
.rich > :first-child { margin-top: 0; }
.rich figure img { cursor: default; }
.rich figure.sel img { outline: 3px solid var(--color-accent); }
.ed-foot { display: flex; flex-wrap: wrap; gap: var(--space-xs); align-items: center; }
.ed-foot .grow { flex: 1; }
.warnbar { padding: 10px 14px; border-radius: var(--radius-ctl); background: oklch(96% 0.04 85); color: oklch(35% 0.06 70); font-size: var(--text-sm); }

/* dialogs */
dialog { border: 0; padding: 0; border-radius: 16px; width: min(640px, calc(100vw - 24px)); max-height: calc(100vh - 32px); background: var(--color-paper); color: var(--color-ink-2); box-shadow: 0 20px 60px oklch(0% 0 0 / .25); }
dialog::backdrop { background: oklch(16% 0 0 / .35); }
dialog .dh { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: var(--space-sm); padding: var(--space-md) var(--space-lg); border-bottom: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); }
dialog .dh h3 { margin: 0; padding: 0; border: 0; flex: 1; font-size: var(--text-lg); }
dialog .db { padding: var(--space-lg); display: grid; gap: var(--space-md); }
dialog .df { position: sticky; bottom: 0; display: flex; gap: var(--space-xs); align-items: center; padding: var(--space-md) var(--space-lg); border-top: var(--rule-hair) solid var(--color-rule); background: var(--color-paper); }
dialog .df .grow { flex: 1; }
.kv { display: grid; grid-template-columns: 6em minmax(0, 1fr); gap: 8px var(--space-md); margin: 0; font-size: var(--text-sm); }
.kv dt { color: var(--color-muted); }
.kv dd { margin: 0; color: var(--color-ink); }

/* calendar */
.cal { padding-block: var(--space-xl) var(--space-3xl); }
.cal-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-sm) var(--space-md); margin-bottom: var(--space-md); }
.cal-head h2 { margin: 0; font-size: var(--text-2xl); line-height: 1; min-width: 6.5em; }
.cal-head .nav { display: flex; gap: 4px; }
.cal-head .grow { flex: 1; }
.cal-sub { margin: 0 0 var(--space-lg); color: var(--color-muted); font-size: var(--text-sm); max-width: 60em; }
.daily { margin: 0 0 var(--space-lg); border-top: var(--rule-hair) solid var(--color-ink); }
.daily h3 { margin: 0; padding: var(--space-sm) 0 var(--space-xs); border: 0; font-size: var(--text-base); display: flex; gap: var(--space-sm); align-items: baseline; }
.daily h3 small { font-weight: 400; color: var(--color-muted); font-size: var(--text-xs); letter-spacing: 0; }
.daily ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 6px var(--space-md); }
.daily li button { width: 100%; display: flex; gap: 8px; align-items: center; text-align: left; border: 0; background: transparent; padding: 6px 8px; border-radius: var(--radius-ctl); font-size: var(--text-sm); color: var(--color-ink-2); }
.daily li button:hover { background: var(--color-paper-3); }
.daily .slot { flex: none; font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); width: 3.2em; }
.daily .nm { flex: 1; min-width: 0; }
.dow { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); border-top: var(--rule-hair) solid var(--color-ink); }
.dow div { padding: 8px 8px 6px; font-size: var(--text-xs); font-weight: 600; color: var(--color-muted); }
.dow div:first-child, .wk .d.sun .num { color: oklch(52% 0.15 27); }
.wk { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); grid-auto-rows: auto; row-gap: 3px; padding-bottom: 8px; min-height: 118px; position: relative; border-top: var(--rule-hair) solid var(--color-rule); }
.wk .d { grid-row: 1 / -1; position: relative; border-left: var(--rule-hair) solid var(--color-rule-2); z-index: 0; }
.wk .d:first-child { border-left: 0; }
.wk .d.out { background: var(--color-paper-2); }
.wk .d.out .num { color: var(--color-rule); }
.wk .d.today { background: color-mix(in oklch, var(--color-accent-soft) 45%, var(--color-paper)); }
.wk .num { grid-row: 1; padding: 6px 8px 2px; font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); color: var(--color-ink); z-index: 1; pointer-events: none; display: flex; gap: 6px; align-items: baseline; }
.wk .num em { font-style: normal; font-family: var(--font-body); font-size: 10px; font-weight: 700; color: var(--color-accent-ink); background: var(--color-accent); border-radius: 99px; padding: 0 6px; }
.it { z-index: 1; margin: 0 3px; min-width: 0; display: flex; align-items: center; gap: 5px; border: 0; border-radius: 6px; padding: 2px 6px 2px 3px; background: var(--pc-soft); box-shadow: inset 3px 0 0 var(--pc); font-size: 12px; line-height: 1.45; font-weight: 600; color: var(--color-ink); text-align: left; overflow: hidden; }
.it span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.it i { flex: none; font-style: normal; display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--pc); color: var(--color-paper); font-size: 9px; margin-left: 3px; }
.it:hover { filter: brightness(.97); box-shadow: inset 3px 0 0 var(--pc), 0 0 0 1px var(--pc); }
.it.cont { border-top-left-radius: 0; border-bottom-left-radius: 0; margin-left: 0; box-shadow: none; }
.it.open { border-top-right-radius: 0; border-bottom-right-radius: 0; margin-right: 0; }
.it.ev { background: var(--color-ink); color: var(--color-paper); box-shadow: none; padding-left: 8px; }
.it.ev:hover { box-shadow: none; filter: none; background: var(--color-ink-2); }
.it.dim { opacity: .28; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.cal-list { display: none; }
@media (max-width: 760px) {
  .dow, .weeks { display: none; }
  .cal-list { display: grid; gap: var(--space-md); }
  .cal-list .grp { border-top: var(--rule-hair) solid var(--color-ink); padding-top: var(--space-xs); }
  .cal-list h4 { margin: 0 0 6px; font-size: var(--text-sm); }
  .cal-list .row { display: flex; flex-wrap: wrap; gap: 6px; }
  .cal-list .it { margin: 0; }
}

/* gate */
.gate { min-height: 100vh; display: grid; place-items: center; padding: var(--space-lg); background: var(--color-paper-2); }
.gate form { width: min(440px, 100%); display: grid; gap: var(--space-md); padding: var(--space-xl); background: var(--color-paper); border: var(--rule-hair) solid var(--color-rule); border-radius: 16px; }
.gate h1 { margin: 0; font-size: var(--text-xl); line-height: 1.2; }
.gate p { margin: 0; color: var(--color-muted); font-size: var(--text-sm); }
.loading { padding: var(--space-3xl) 0; text-align: center; color: var(--color-muted); }

/* toast with undo */
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 60; display: flex; gap: var(--space-sm); align-items: center; padding: 10px 10px 10px 16px; border-radius: var(--radius-ctl); background: var(--color-ink); color: var(--color-paper); font-size: var(--text-sm); box-shadow: 0 8px 30px oklch(0% 0 0 / .25); max-width: calc(100vw - 24px); }
.toast .btn { min-height: 30px; background: transparent; color: var(--color-paper); border-color: oklch(45% 0 0); }
.toast .btn:hover { background: oklch(28% 0 0); }


/* ===== v2 layout: tabs, list + one item, routine board ===== */
.brand { font-family: var(--font-display); font-weight: 700; font-size: var(--text-sm); color: var(--color-ink); text-decoration: none; white-space: nowrap; letter-spacing: -0.02em; margin-right: 4px; }
.tabs .cnt:not(:empty) { display: inline-block; min-width: 20px; padding: 0 6px; margin-left: 2px; border-radius: 99px; background: var(--color-ink); color: var(--color-paper); font-size: 11px; line-height: 18px; text-align: center; }
.split { padding-block: 0 var(--space-3xl); }
.navpane { position: sticky; top: calc(var(--bar-h) + 16px); max-height: calc(100vh - var(--bar-h) - 32px); overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
.searchbox { position: sticky; top: 0; z-index: 2; background: var(--color-paper); padding-bottom: var(--space-sm); }
.searchbox .field { min-height: 44px; }
#navList .who-filter { margin-bottom: var(--space-sm); padding-bottom: var(--space-sm); }
#navList .grp { margin-top: var(--space-md); }
#navList .gh { display: flex; align-items: center; justify-content: space-between; padding: 0 4px 2px 12px; font-size: var(--text-sm); font-weight: 700; color: var(--color-ink); }
#navList .gh .btn { opacity: 0; min-height: 26px; }
#navList .grp:hover .gh .btn, #navList .gh .btn:focus-visible { opacity: 1; }
#navList ol { list-style: none; margin: 2px 0 0; padding: 0; }
#navList a { display: flex; gap: 8px; align-items: baseline; padding: 7px 12px; border-radius: var(--radius-ctl); color: var(--color-ink-2); text-decoration: none; font-weight: 400; font-size: var(--text-sm); line-height: 1.4; }
#navList a:hover { background: var(--color-paper-3); color: var(--color-ink); }
#navList a[aria-current="page"] { background: var(--color-accent-soft); color: var(--color-accent-soft-ink); font-weight: 600; }
#navList .n { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-muted); flex: none; }
#navList .nt { flex: 1; min-width: 0; }
#navList .nw { font-size: 11px; color: var(--color-muted); flex: none; }
#navList .homelink { font-weight: 600; color: var(--color-ink); background: var(--color-paper-2); box-shadow: inset 0 0 0 1px var(--color-rule); }
#navList .hits { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
#navList .hits a { display: grid; gap: 1px; }
#navList .ht { font-weight: 600; color: var(--color-ink); }
#navList .hc, #navList .hs { font-size: var(--text-xs); color: var(--color-muted); }
.navhint { margin: 4px 12px 8px; font-size: var(--text-xs); color: var(--color-muted); }
#detail { min-width: 0; }
section.one { border-top: 0; padding-top: 0; }
section.one > h2 { font-size: var(--text-2xl); line-height: 1.15; margin-bottom: var(--space-sm); }
section.one.editing { padding-top: var(--space-lg); margin-top: 0; }
.crumb { margin: 0 0 4px; font-size: var(--text-xs); color: var(--color-muted); font-weight: 600; }
.pn { display: flex; justify-content: space-between; gap: var(--space-md); margin-top: var(--space-2xl); padding-top: var(--space-md); border-top: var(--rule-hair) solid var(--color-ink); }
.pn a { display: grid; gap: 2px; max-width: 48%; text-decoration: none; font-size: var(--text-sm); }
.pn a.nx { text-align: right; }
.pn small { font-size: var(--text-xs); color: var(--color-muted); font-weight: 400; }
.back { display: none; margin-bottom: var(--space-md); font-size: var(--text-sm); text-decoration: none; }
details.fold { border-top: var(--rule-hair) solid var(--color-rule); }
details.fold:last-of-type { border-bottom: var(--rule-hair) solid var(--color-rule); }
details.fold > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 14px 4px; font-family: var(--font-display); font-weight: 700; font-size: var(--text-lg); color: var(--color-ink); letter-spacing: -0.02em; border-radius: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "+"; flex: none; display: inline-grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--color-ink); font-family: var(--font-outlier); font-size: 15px; font-weight: 400; }
details.fold[open] > summary::before { content: "−"; background: var(--color-ink); color: var(--color-paper); }
details.fold > summary:hover { background: var(--color-paper-2); }
details.fold[open] { padding-bottom: var(--space-md); }
.qmark { font-family: var(--font-body); font-size: 11px; font-weight: 600; letter-spacing: 0; padding: 1px 8px; border-radius: 99px; background: var(--color-ink); color: var(--color-paper); }
.foldbar { display: flex; align-items: center; gap: var(--space-sm); margin: var(--space-lg) 0 var(--space-xs); font-size: var(--text-xs); color: var(--color-muted); }
.home h2 { margin: 0 0 var(--space-sm); font-size: var(--text-2xl); line-height: 1.1; }
.home .lead { color: var(--color-muted); max-width: var(--measure); margin: 0 0 var(--space-lg); }
.hh { margin: var(--space-xl) 0 var(--space-sm); padding: 0; border: 0; font-size: var(--text-lg); display: flex; gap: var(--space-sm); align-items: baseline; }
.hh small { font-family: var(--font-body); font-size: var(--text-xs); font-weight: 400; color: var(--color-muted); letter-spacing: 0; }
.cards { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: var(--space-sm); }
.cards a { display: grid; gap: 4px; height: 100%; padding: var(--space-md); border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); text-decoration: none; font-weight: 400; color: var(--color-ink-2); transition: border-color var(--dur-micro), background-color var(--dur-micro); }
.cards a:hover { border-color: var(--color-ink); background: var(--color-paper-2); }
.cards b { color: var(--color-ink); font-size: var(--text-base); line-height: 1.35; }
.cards span { font-size: var(--text-sm); color: var(--color-muted); line-height: 1.5; }
.cards small { font-size: var(--text-xs); color: var(--color-accent-soft-ink); font-weight: 600; }
.nowbox { border: var(--rule-hair) solid var(--color-ink); border-radius: var(--radius-card); padding: var(--space-md); display: grid; gap: var(--space-sm); }
.nowbox .nh { display: flex; flex-wrap: wrap; align-items: center; gap: 6px var(--space-sm); font-size: var(--text-sm); }
.nowbox .nh b { font-size: var(--text-lg); color: var(--color-ink); }
.nowbox .nh span { color: var(--color-muted); }
.nowbox .grow, .rbh .grow, .rt-head .grow { flex: 1; }
.prog { font-family: var(--font-outlier); font-size: var(--text-xs); color: var(--color-ink) !important; background: var(--color-paper-3); padding: 2px 8px; border-radius: 99px; }
.rt-board, .todo-view { padding-block: var(--space-lg) var(--space-3xl); }
.rt-head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-xs) var(--space-md); margin-bottom: var(--space-xs); }
.rt-head h2 { margin: 0; font-size: var(--text-2xl); line-height: 1.1; }
.rt-head p { margin: 0; color: var(--color-ink-2); }
.periods { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-md); margin-bottom: var(--space-md); align-items: start; }
.periods.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.rb { border: var(--rule-hair) solid var(--color-rule); border-radius: var(--radius-card); padding: var(--space-md); background: var(--color-paper); display: grid; gap: var(--space-xs); align-content: start; }
.rb.now { border-color: var(--color-ink); box-shadow: 0 0 0 1px var(--color-ink); }
.rb.now .rbs { color: var(--color-accent-soft-ink); font-weight: 600; }
.rbh { display: flex; align-items: baseline; gap: var(--space-xs); }
.rbh h3 { margin: 0; padding: 0; border: 0; font-size: var(--text-xl); }
.rbs { font-size: var(--text-xs); color: var(--color-muted); }
.rtcards { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.rc { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: var(--radius-ctl); background: var(--color-paper-2); min-height: 48px; }
.rc .ck { flex: none; display: inline-grid; place-items: center; width: 28px; height: 28px; cursor: pointer; }
.rc .ck input { width: 18px; height: 18px; accent-color: var(--color-ink); cursor: pointer; margin: 0; }
.rc .ck.off { cursor: default; }
.rc .ck.off::before { content: ""; width: 14px; height: 2px; background: var(--color-rule); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.rc .rn { flex: 1; min-width: 0; border: 0; background: transparent; padding: 2px 0; text-align: left; display: grid; gap: 1px; }
.rc .rn b { font-size: var(--text-sm); font-weight: 600; color: var(--color-ink); line-height: 1.4; }
.rc .rn span { font-size: var(--text-xs); color: var(--color-muted); }
.rc .rn:hover b { text-decoration: underline; text-decoration-color: var(--color-accent); }
.rc.done { background: transparent; box-shadow: inset 0 0 0 1px var(--color-rule-2); }
.rc.done .rn b { text-decoration: line-through; color: var(--color-muted); }
.rc .rp { flex: none; display: flex; padding-left: 4px; }
.rc .dot { font-style: normal; display: inline-grid; place-items: center; width: 22px; height: 22px; margin-left: -5px; border-radius: 50%; background: var(--pc); color: var(--color-paper); font-size: 10px; font-weight: 700; box-shadow: 0 0 0 2px var(--color-paper-2); }
.rc .rm { flex: none; font-size: var(--text-xs); }
.addrt { border: var(--rule-hair) dashed var(--color-rule); background: transparent; border-radius: var(--radius-ctl); padding: 6px; color: var(--color-muted); font-size: var(--text-xs); font-weight: 600; }
.addrt:hover { border-color: var(--color-ink); color: var(--color-ink); }
.wk2 { margin-bottom: var(--space-md); }
.wkcols { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--space-sm); }
.wkc { display: grid; gap: 6px; align-content: start; padding: 8px; border-radius: var(--radius-ctl); background: var(--color-paper); box-shadow: inset 0 0 0 1px var(--color-rule-2); }
.wkc.now { box-shadow: inset 0 0 0 2px var(--color-ink); }
.wkd { font-size: var(--text-xs); font-weight: 700; color: var(--color-ink); }
.todo-head h2 { margin: 0 0 var(--space-xs); font-size: var(--text-2xl); }
.todo-head .lead { margin: 0 0 var(--space-lg); color: var(--color-muted); }
.todo-view section.one { margin-bottom: var(--space-xl); max-width: 900px; }
.todo-view section.one > h2 { font-size: var(--text-xl); }
.todolist .tg { border-top: var(--rule-hair) solid var(--color-rule); padding: var(--space-sm) 0; }
.todolist .tgh { display: flex; flex-wrap: wrap; gap: 4px var(--space-sm); align-items: baseline; text-decoration: none; }
.todolist .tgh span { font-size: var(--text-xs); color: var(--color-muted); font-weight: 400; }
.todolist ul { margin: 6px 0 0; padding-left: 1.2em; font-size: var(--text-sm); color: var(--color-ink-2); }
dialog.wide { width: min(1000px, calc(100vw - 24px)); }
dialog.wide .dh .btn { flex: none; }

@media (max-width: 900px) {
  .periods, .periods.two { grid-template-columns: minmax(0, 1fr); }
  .tabs button { padding: 6px 10px; }
}

.wkc .rc { display: grid; grid-template-columns: 28px minmax(0, 1fr) auto; grid-template-areas: "ck rn rn" ". rp rm"; align-items: center; row-gap: 2px; }

function rtWhenLabel(r){

  if (c === 'weekly') return '매주 ' + (r.days || []).map(function(d){ return W[d]; }).join(', ');
  if (c === 'monthly') return '매월 ' + r.mdFrom + (r.mdTo && r.mdTo !== r.mdFrom ? '~' + (r.mdTo >= 31 ? '말' : r.mdTo) : '') + '일';
  if (c === 'event') return r.evKey + ' ' + (r.offset === 0 ? '당일' : r.offset === 1 ? '다음 날' : r.offset > 0 ? r.offset + '일 뒤' : (-r.offset) + '일 전');
  return '';
}
function whenText(r){
  var c = r.cycle || 'daily';

  if (c === 'weekdays') return '평일';
  if (c === 'weekly') return (r.days || []).map(function(d){ return W[d]; }).join(',');
  if (c === 'monthly') return r.mdFrom + (r.mdTo && r.mdTo !== r.mdFrom ? '-' + (r.mdTo >= 31 ? '말' : r.mdTo) : '') + '일';

}
function parseWhen(s){

  if (ev && !/^\d/.test(ev[1])) { var off = /당일/.test(ev[2]) ? 0 : /다음/.test(ev[2]) ? 1 : (+ev[3]) * (ev[4] === '전' ? -1 : 1); return { cycle: 'event', evKey: ev[1].trim(), offset: off }; }
  var mr = s.match(/(\d{1,2})\s*[-~]\s*(\d{1,2}|말)\s*일?/);
  if (mr) return { cycle: 'monthly', mdFrom: +mr[1], mdTo: mr[2] === '말' ? 31 : +mr[2] };
  var m1 = s.match(/^(?:매월\s*)?(\d{1,2})\s*일$/); if (m1) return { cycle: 'monthly', mdFrom: +m1[1], mdTo: +m1[1] };

  if (days.length) return { cycle: 'weekly', days: days };

  if (c === 'event') { var key = String(r.evKey || ''); return liveEvents().some(function(x){ return String(x.data.t || '').indexOf(key) >= 0 && x.data.date && addDays(x.data.date, r.offset || 0) === date; }); }

/* ---------- sanitize editor html ---------- */
function clean(html){
  var doc = new DOMParser().parseFromString('<div id="r">' + html + '</div>', 'text/html');
  var root = doc.getElementById('r');
  root.querySelectorAll('script,style,iframe,object,embed,link,meta,form,input,button,textarea,select,video,audio,svg').forEach(function(e){ e.remove(); });
  root.querySelectorAll('*').forEach(function(e){
    Array.prototype.slice.call(e.attributes).forEach(function(a){
      var n = a.name.toLowerCase();
      if (n.indexOf('on') === 0 || n === 'style' || n === 'contenteditable' || n === 'id' || n === 'target' || n === 'rel') e.removeAttribute(a.name);
      else if ((n === 'href' || n === 'src') && /^\s*(javascript|vbscript):/i.test(a.value)) e.removeAttribute(a.name);
    });
    if (e.tagName === 'IMG') { if (e.getAttribute('data-img')) e.removeAttribute('src'); else e.remove(); }
    if (e.tagName === 'FIGURE') e.classList.remove('sel');
    if (e.tagName === 'SPAN' && !e.attributes.length && e.parentNode) { while (e.firstChild) e.parentNode.insertBefore(e.firstChild, e); e.remove(); }
    if (e.tagName === 'FONT' && e.parentNode) { while (e.firstChild) e.parentNode.insertBefore(e.firstChild, e); e.remove(); }
  });
  root.querySelectorAll('[class=""]').forEach(function(e){ e.removeAttribute('class'); });
  return root.innerHTML.replace(/<p><br><\/p>\s*$/,'').trim();
}

function wantImage(id){ if (IMG[id] || imgWant[id]) return; imgWant[id] = true; clearTimeout(imgTimer); imgTimer = setTimeout(pullImages, 60); }
async function pullImages(){
  var ids = Object.keys(imgWant).filter(function(k){ return imgWant[k] === true; });
  if (!ids.length) return;

    var part = ids.slice(i, i + 8);

    if (r.error) { part.forEach(function(k){ delete imgWant[k]; }); continue; }
    r.data.forEach(function(x){ IMG[x.id] = 'data:' + x.mime + ';base64,' + x.b64; delete imgWant[x.id]; document.querySelectorAll('img[data-img="' + x.id + '"]').forEach(function(im){ im.src = IMG[x.id]; }); });
  }
}

}
function fileToJpeg(file){
  return new Promise(function(res, rej){
    var fr = new FileReader();
    fr.onload = function(){
      var im = new Image();
      im.onload = function(){
        var max = 1400, w = im.naturalWidth, h = im.naturalHeight, k = Math.min(1, max / w);
        var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
        var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        var url = c.toDataURL('image/jpeg', 0.86);

      im.onerror = rej; im.src = fr.result;
    };

  else if (a === 'remind') copyText(remindText(b.getAttribute('data-v')));
  else if (a === 'resm') { var rm = (ui.resMonth || today().slice(0, 7)) + '-01'; var dd = pd(rm); dd.setMonth(dd.getMonth() + (+b.getAttribute('data-v'))); ui.resMonth = ymd(dd).slice(0, 7); ui.resOpen = true; renderLive(); }
  else if (a === 'lvpick') { var v = b.getAttribute('data-v'); ui.lvPick = ui.lvPick || []; if (!v) ui.lvPick = []; else if (ui.lvPick.indexOf(v) >= 0) ui.lvPick = ui.lvPick.filter(function(x){ return x !== v; }); else ui.lvPick = ui.lvPick.concat([v]); renderLive(); }
  else if (a === 'lvpair') { var pv = b.getAttribute('data-v').split(','); ui.lvPick = b.getAttribute('aria-pressed') === 'true' ? [] : pv; renderLive(); }
  else if (a === 'lvprev' || a === 'lvnext') { ui.liveStart = addDays(liveDays()[0], a === 'lvnext' ? 21 : -21); render(); }
  else if (a === 'lvnow') { ui.liveStart = null; render(); }
  else if (a === 'avadd') openAvailDialog(null, b.getAttribute('data-coach'));
  else if (a === 'avedit') openAvailDialog(id);
  else if (a === 'fxedit') openFixedDialog();
  else if (a === 'blkadd') addBlock();
  else if (a === 'blkdel') { var bk = LP.block[id]; if (bk && confirm(md(bk.data.date) + ' ' + bk.data.reason + '을 빼까요?')) saveLive([{ id: id, kind: 'block', data: bk.data, deleted: true }]).then(render); }
  else if (a === 'rtfilter') { ui.rtFilter = b.getAttribute('data-v'); render(); }
  else if (a === 'rdone') { setDone(id, b.getAttribute('data-key'), b.checked); }
  else if (a === 'foldall') { var fs2 = b.closest('.sbody').querySelectorAll('details.fold'), open = !Array.prototype.every.call(fs2, function(x){ return x.open; }); fs2.forEach(function(x){ x.open = open; }); b.textContent = open ? '모두 접기' : '모두 펼치기'; }
  else if (a === 'rtunlink') { ED.links = ED.links.filter(function(x){ return x !== id; }); renderEdRts(); }
  else if (a === 'rtnewopen') { $('edRtNew').hidden = false; $('nrT').value = $('edTitle').value; $('nrT').focus(); }
  else if (a === 'rtnewdel') { ED.newRts.splice(+b.getAttribute('data-i'), 1); renderEdRts(); }
  else if (a === 'rtnewadd') { var t = $('nrT').value.trim(); if (!t) { $('nrT').focus(); return; } var w = parseWhen($('nrW').value); if (!w) { toast('언제를 알아듣지 못했어요'); $('nrW').focus(); return; } ED.newRts.push(Object.assign({ t: t, slot: $('nrS').value }, w)); $('nrT').value = ''; $('nrW').value = ''; $('edRtNew').hidden = true; renderEdRts(); }
});
/* dialogs: 닫기·취소·바깥 클릭·Esc 모두 닫힌다. 적은 내용이 있을 때만 한 번 묻는다 */
function dlgDirty(){ return Array.prototype.slice.call($('dlg').querySelectorAll('input:not([type=checkbox]),textarea')).some(function(i){ return i.value !== i.defaultValue; }); }
function dlgClose(){ if (dlgDirty() && !confirm('적은 내용이 저장되지 않아요. 닫을까요?')) return; $('dlg').close(); }
document.addEventListener('click', function(e){ var b = e.target.closest('dialog button[value="close"]'); if (b) { e.preventDefault(); dlgClose(); } }, true);
$('dlg').addEventListener('mousedown', function(e){ if (e.target === this) { var r = this.getBoundingClientRect(); if (e.clientX < r.left || e.clientX > r.right || e.clientY < r.top || e.clientY > r.bottom) dlgClose(); } });
$('dlg').addEventListener('cancel', function(e){ e.preventDefault(); dlgClose(); });
$('dlg').addEventListener('submit', function(e){ e.preventDefault(); });
window.addEventListener('beforeunload', function(e){ if (ui.editing) { e.preventDefault(); e.returnValue = ''; } });

/* ---------- boot ---------- */
function showGate(err, info){
  $('app').hidden = true; $('gate').hidden = false;
  $('gName').value = PEOPLE.indexOf(ui.me) >= 0 ? ui.me : (ui.me ? '__etc' : '');
  $('gEtc').hidden = $('gName').value !== '__etc'; if (!$('gEtc').hidden) $('gEtc').value = ui.me;
  $('gErr').textContent = err || info || ''; $('gErr').hidden = !(err || info); $('gErr').className = err ? 'hint bad' : 'hint ok';
}
async function join(code, name){
  var ses = (await SB.auth.getSession()).data.session;
  if (!ses) { var si = await SB.auth.signInAnonymously(); if (si.error) throw si.error; }
  var j = await SB.rpc('join_team', { code: code, display_name: name });
  if (j.error) {
    // the saved login may belong to a removed user: start a fresh one and try once more
    await SB.auth.signOut().catch(function(){});
    var si2 = await SB.auth.signInAnonymously(); if (si2.error) throw si2.error;
    j = await SB.rpc('join_team', { code: code, display_name: name });
    if (j.error) throw j.error;
  }
  if (j.data) localStorage.setItem(KEY_K, code);
  return !!j.data;
}
/* the team code is kept in this browser after the first entry, so a lost login reconnects by itself */
var KEY_K = 'rizz-manual-k';
async function rejoin(){ var k = localStorage.getItem(KEY_K); if (!k || !ui.me) return false; try { return await join(k, ui.me); } catch (e) { return false; } }
async function enter(){
  $('gate').hidden = true; $('app').hidden = false; $('detail').innerHTML = '<p class="loading">불러오는 중…</p>'; setSync('wait');
  var n = 0;
  try { n = await loadAll(); } catch (e) { setSync('bad'); $('detail').innerHTML = '<p class="loading">불러오지 못했어요. 새로고침해 주세요.</p>'; return; }
  if (!n && await rejoin()) { try { n = await loadAll(); } catch (e) {} }
  if (!n) { await SB.auth.signOut().catch(function(){}); localStorage.removeItem(KEY_K); showGate('팀 연결이 끊겼어요. 업무 위젯 자료 칸의 “강의코치팀 업무 인수인계”로 다시 들어오거나 팀 코드를 넣어 주세요.'); return; }
  setSync('live'); route();
  ensureCollectTask().catch(function(){});
  var first = true;
  SB.channel('manual-live').on('postgres_changes', { event: '*', schema: 'public', table: 'manual' }, onRemoteManual)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, onRemoteItem)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'live_plan' }, onRemoteLive)
    .subscribe(function(st){ if (st === 'SUBSCRIBED') { setSync('live'); if (!first) refresh(); first = false; } else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') setSync('wait'); });
  setInterval(refresh, 120000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) refresh(); });
}
var lastRefresh = 0;
async function refresh(){ if (Date.now() - lastRefresh < 15000) return; lastRefresh = Date.now(); try { var n = await loadAll(); if (!n) { if (await rejoin()) n = await loadAll(); if (!n) { setSync('bad'); return; } } setSync('live'); if (!ui.editing && !$('dlg').open) softRender(); else ui.pendingRemote = true; } catch (e) { setSync('bad'); } }
async function boot(){
  if (!window.supabase) { document.body.innerHTML = '<p class="loading">화면 부품을 불러오지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</p>'; return; }
  SB = window.supabase.createClient(SB_URL, SB_KEY, { auth: { storageKey: 'rizz-manual-auth', persistSession: true, autoRefreshToken: true } });
  $('gName').addEventListener('change', function(){ $('gEtc').hidden = this.value !== '__etc'; if (!$('gEtc').hidden) $('gEtc').focus(); });
  $('showWho').addEventListener('change', function(){ ui.showWho = this.checked; localStorage.setItem(WHO_KEY, this.checked ? '1' : '0'); if (!ui.showWho) ui.filter = '전체'; if (ui.editing) { toast('고치는 중에는 바꿀 수 없어요'); this.checked = !this.checked; ui.showWho = this.checked; return; } softRender(); });
  $('meBtn').addEventListener('click', function(){ var v = prompt('이름을 넣어 주세요 (경은, 연주, 예은 또는 새 이름)', ui.me || ''); if (v == null) return; v = matchPerson(v) || v.trim(); if (!v) return; ui.me = v; localStorage.setItem(ME_KEY, v); render(); });
  $('q').addEventListener('input', function(){ ui.q = this.value; renderHits(); });
  $('q').addEventListener('focus', function(){ renderHits(); });
  document.addEventListener('mousedown', function(e){ if (!e.target.closest('.tn-search')) $('hitList').hidden = true; });
  $('q').addEventListener('keydown', function(e){
    if (e.key === 'Escape') { this.value = ''; ui.q = ''; renderHits(); }
    if (e.key === 'Enter') { var h = searchHits(this.value)[0]; if (h) openSection(h.s.id); }
  });
  $('dlg').addEventListener('close', function(){ this.className = ''; });
  window.addEventListener('resize', function(){ if (!ui.editing && !$('viewSplit').hidden) document.body.classList.toggle('has-sel', !!ui.sel); });
  $('gForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var name = $('gName').value === '__etc' ? $('gEtc').value.trim() : $('gName').value;
    var code = $('gCode').value.trim();
    if (!name) { showGate('이름을 골라 주세요'); return; }
    if (!code) { showGate('팀 코드를 넣어 주세요'); return; }
    $('gBtn').disabled = true; $('gBtn').textContent = '확인하는 중';
    try { var ok = await join(code, name); if (!ok) throw new Error('code'); ui.me = name; localStorage.setItem(ME_KEY, name); history.replaceState(null, '', location.pathname); await enter(); }
    catch (er) { showGate(er && er.message === 'code' ? '팀 코드가 맞지 않아요. 업무 위젯 자료 칸의 “강의코치팀 업무 인수인계”로 들어오면 코드 없이 열려요.' : '연결하지 못했어요. 잠시 뒤 다시 눌러 주세요.'); }
    $('gBtn').disabled = false; $('gBtn').textContent = '들어가기';
  });
  // code passed from the 업무 위젯 (#join=...) is used once and removed from the address bar
  var hm = location.hash.match(/join=([^&]+)/);
  if (hm) { var code = decodeURIComponent(hm[1]); history.replaceState(null, '', location.pathname); $('gCode').value = code; if (ui.me) { try { if (await join(code, ui.me)) { await enter(); return; } } catch (e) {} } showGate('', ui.me ? '' : '팀 코드는 들어있어요. 이름만 고르고 들어가기를 누르세요'); return; }
  var ses = (await SB.auth.getSession()).data.session;
  if (ses && ui.me) { try { await enter(); return; } catch (e) {} }
  showGate();
}
boot();
})();
